services:
  - type: web
    name: wedding-studio-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: ASSIGNMENT_HOST
        value: 0.0.0.0
      - key: OWNER_PASSWORD
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
