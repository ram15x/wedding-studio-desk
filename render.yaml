services:
  - type: web
    name: wedding-studio-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: ASSIGNMENT_HOST
        value: 0.0.0.0
      - key: ASSIGNMENT_PORT
        value: 10000
      - key: OWNER_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: OPENROUTER_MODELS
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_ALLOW_GROUNDED_DATA
        value: "1"
