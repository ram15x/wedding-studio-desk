services:
  - type: web
    name: wedding-studio-desk
    runtime: python
    # Preview only. Render Free has ephemeral storage; do not use this setup
    # for family data that must survive restarts or deploys.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: ASSIGNMENT_HOST
        value: 0.0.0.0
      - key: ASSIGNMENT_PORT
        value: 10000
      - key: OWNER_PASSWORD
        sync: false
